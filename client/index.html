<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MERN Student App</title><style>body{font-family:Arial,sans-serif;margin:30px;}table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background-color:#f2f2f2;}input,button{padding:8px;margin:5px 0;width:100%;box-sizing:border-box;}.btn-edit{background-color:#4CAF50;color:white;border:none;margin-right:5px;cursor:pointer;}.btn-delete{background-color:#f44336;color:white;border:none;cursor:pointer;}</style></head><body><h2>Thong Tin Sinh Vien</h2><form id="studentForm"><input type="hidden" id="editId"><input type="text" id="studentId" placeholder="Ma SV (VD: SV001)" required><input type="text" id="name" placeholder="Ho va Ten" required><input type="email" id="email" placeholder="Email" required><button type="submit" id="submitBtn">Them Sinh Vien</button></form><h2>Danh Sach Sinh Vien</h2><table><thead><tr><th>Ma SV</th><th>Ho ten</th><th>Email</th><th>Hanh dong</th></tr></thead><tbody id="studentList"></tbody></table><script>const API_URL="http://localhost:5000/api/students";let students=[];async function fetchStudents(){const res=await fetch(API_URL);students=await res.json();const list=document.getElementById("studentList");list.innerHTML="";students.forEach(s=>{list.innerHTML+=`<tr><td>${s.studentId}</td><td>${s.name}</td><td>${s.email}</td><td><button class="btn-edit" onclick="editStudent(\x27${s._id}\x27)">Sua</button><button class="btn-delete" onclick="deleteStudent(\x27${s._id}\x27)">Xoa</button></td></tr>`;});}document.getElementById("studentForm").addEventListener("submit",async(e)=>{e.preventDefault();const editId=document.getElementById("editId").value;const studentId=document.getElementById("studentId").value;const name=document.getElementById("name").value;const email=document.getElementById("email").value;if(editId){await fetch(`${API_URL}/${editId}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email})});document.getElementById("editId").value="";document.getElementById("submitBtn").innerText="Them Sinh Vien";}else{await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({studentId,name,email})});}document.getElementById("studentForm").reset();fetchStudents();});function editStudent(id){const s=students.find(item=>item._id===id);if(s){document.getElementById("editId").value=s._id;document.getElementById("studentId").value=s.studentId;document.getElementById("name").value=s.name;document.getElementById("email").value=s.email;document.getElementById("submitBtn").innerText="Cap Nhat Sinh Vien";}}async function deleteStudent(id){if(confirm("Xac nhan xoa?")){await fetch(`${API_URL}/${id}`,{method:"DELETE"});fetchStudents();}}fetchStudents();</script></body></html>
